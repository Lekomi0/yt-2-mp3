<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube → MP3</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { overflow-x: hidden; }

        body {
            min-height: 100vh;
            background-color: #ff1464;
            background-image:
                repeating-linear-gradient(0deg, #e01158 0 1px, transparent 1px 40px),
                repeating-linear-gradient(90deg, #e01158 0 1px, transparent 1px 40px),
                radial-gradient(circle at 10px 10px, #ff4d8a 3px, transparent 4px);
            background-size: 40px 40px, 40px 40px, 40px 40px;
            font-family: Verdana, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 16px;
        }

        .page {
            max-width: 620px;
            width: 100%;
            position: relative;
        }

        .deco {
            position: fixed;
            pointer-events: none;
            z-index: 0;
            filter: drop-shadow(2px 3px 0 rgba(0,0,0,0.35));
        }
        @keyframes floaty {
            0%, 100% { transform: translateY(0) rotate(var(--r, 0deg)); }
            50% { transform: translateY(-12px) rotate(var(--r, 0deg)); }
        }
        @keyframes spinny { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .float { animation: floaty 3.2s ease-in-out infinite; }
        .spin { animation: spinny 5s linear infinite; }

        @media (max-width: 760px) { .deco { display: none; } }

        .chrome-sub {
            text-align: center;
            color: #fff;
            font-size: 12px;
            letter-spacing: 1px;
            margin-bottom: 26px;
            text-transform: uppercase;
            margin-top: 10px;
        }

        hr.thin {
            border: none;
            height: 1px;
            background: #b30d45;
            box-shadow: 0 1px 0 #ff6fa3;
            margin: 18px 0;
        }

        .converter-box {
            max-width: 420px;
            margin: 24px auto;
            background: #d8d8d8;
            border: 2px outset #fff;
            padding: 18px;
        }
        .converter-box .title {
            text-align: center;
            font-weight: bold;
            color: #003399;
            background: linear-gradient(180deg, #fff, #b8c8e8);
            border: 1px solid #6699cc;
            padding: 4px;
            font-size: 13px;
            margin-bottom: 12px;
        }
        .input-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .input-group input {
            flex: 1;
            min-width: 180px;
            padding: 5px 7px;
            border: 1px inset #808080;
            font-size: 12px;
            font-family: Verdana, sans-serif;
        }
        .input-group button {
            padding: 5px 16px;
            border: 1px outset #d4d0c8;
            background: #d4d0c8;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }
        .input-group button:active { border-style: inset; }

        #result {
            margin-top: 10px;
            padding: 8px 10px;
            background: #000;
            color: #0f0;
            font-family: "Courier New", monospace;
            font-size: 12px;
            word-break: break-all;
            min-height: 36px;
            border: 1px inset #808080;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
        }
        #result a { color: #0ff; }
        .copy-btn {
            border: 1px outset #d4d0c8;
            background: #d4d0c8;
            padding: 3px 10px;
            font-size: 11px;
            cursor: pointer;
        }
        .copy-btn:active { border-style: inset; }
        .copy-btn.copied { background: #90ee90; }
        .loading { color: #cc7a00; }

        .track-list {
            margin-top: 12px;
            background: #000;
            padding: 8px 10px;
            border: 1px inset #808080;
            max-height: 340px;
            overflow-y: auto;
        }
        .track-item {
            display: flex;
            align-items: center;
            padding: 5px 0;
            border-bottom: 1px solid #333;
            color: #0f0;
            font-size: 12px;
            gap: 8px;
        }
        .track-item:last-child { border-bottom: none; }
        .track-thumb {
            width: 80px;
            height: 60px;
            object-fit: cover;
            flex-shrink: 0;
        }
        .track-title {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .track-action {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .track-btn {
            background: #d4d0c8;
            border: 1px outset #d4d0c8;
            padding: 2px 10px;
            font-size: 11px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .track-btn:active { border-style: inset; }
        .track-btn:disabled { cursor: default; opacity: 0.7; }

        .track-link-btn {
            background: #1a4d1a;
            border: 1px outset #2a7a2a;
            color: #9dff9d;
            padding: 2px 8px;
            font-size: 11px;
            cursor: pointer;
            text-decoration: none;
            white-space: nowrap;
        }
        .track-link-btn:active { border-style: inset; }
        .track-copy-btn {
            background: #d4d0c8;
            border: 1px outset #d4d0c8;
            padding: 2px 8px;
            font-size: 11px;
            cursor: pointer;
        }
        .track-copy-btn:active { border-style: inset; }
        .track-copy-btn.copied { background: #90ee90; }

        .track-checkbox {
            flex-shrink: 0;
            margin-right: 4px;
        }

        .batch-buttons {
            margin-top: 12px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .batch-buttons button {
            padding: 4px 12px;
            border: 1px outset #d4d0c8;
            background: #d4d0c8;
            font-size: 12px;
            cursor: pointer;
        }
        .batch-buttons button:active { border-style: inset; }
        .batch-buttons button:disabled { opacity: 0.5; cursor: default; }

        .linklist {
            list-style: none;
            font-size: 13px;
            margin: 16px 0;
        }
        .linklist li {
            padding: 4px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .linklist .globe {
            width: 14px; height: 14px;
            border-radius: 50%;
            background: conic-gradient(#2a7, #274 25%, #2a7 50%, #274 75%, #2a7);
            border: 1px solid #143;
            flex-shrink: 0;
        }
        .linklist a { color: #fff; text-decoration: underline; }
        .linklist a:visited { color: #ffd6e6; }

        .footer {
            text-align: center;
            font-size: 11px;
            color: #ffd6e6;
            margin-top: 26px;
            border-top: 1px solid #e01158;
            padding-top: 10px;
        }
        .footer a { color: #fff; }

        html, body {
            overflow: hidden;
            height: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
<div class="page">

    <div class="chrome-sub">youtube → mp3 direct link</div>

    <hr class="thin">

    <div class="converter-box">
        <div class="title">★ вставь ссылку на YouTube ★</div>
        <div class="input-group">
            <input id="urlInput" type="text" placeholder="ссылка на YouTube" spellcheck="false">
            <button onclick="process()">Enter</button>
        </div>
        <div id="result">
            <span class="link">&gt; ожидание ссылки...</span>
        </div>
        <div id="trackList" class="track-list" style="display:none;"></div>
        <div id="batchButtons" class="batch-buttons" style="display:none;">
            <button id="zipBtn" onclick="downloadZip()">📦 Скачать ZIP</button>
            <button id="mergeBtn" onclick="downloadMerge()">🔗 Объединить в один MP3</button>
        </div>
    </div>

    <hr class="thin">

    <ul class="linklist">
        <li><span class="globe"></span> вставь ссылку на YouTube</li>
        <li><span class="globe"></span> получи прямую ссылку на MP3</li>
        <li><span class="globe"></span> ссылка работает ~1 час</li>
    </ul>

    <div class="footer">
        lekomi's page
    </div>

</div>

<script>
    document.getElementById('urlInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') process();
    });

    // ===== АВТО-ДЕКОР =====
    function getForbiddenRect() {
        const el = document.querySelector('.page');
        const r = el.getBoundingClientRect();
        const pad = 24;
        return { left: r.left - pad, right: r.right + pad, top: r.top - pad, bottom: r.bottom + pad };
    }

    function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    function buildGrid(count, forbidden) {
        const vw = window.innerWidth;
        const vh = window.innerHeight;
        const targetCells = Math.max(count * 2, 12);
        const cols = Math.max(3, Math.round(Math.sqrt(targetCells * (vw / vh))));
        const rows = Math.max(3, Math.ceil(targetCells / cols));
        const cellW = vw / cols;
        const cellH = vh / rows;

        const cells = [];
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                const x0 = c * cellW, y0 = r * cellH;
                const x1 = x0 + cellW, y1 = y0 + cellH;
                const overlaps = !(x1 < forbidden.left || x0 > forbidden.right || y1 < forbidden.top || y0 > forbidden.bottom);
                if (!overlaps) cells.push({ x0, y0, w: cellW, h: cellH });
            }
        }
        return cells;
    }

    async function loadDecorations() {
        try {
            const res = await fetch('img/images.json');
            if (!res.ok) return;
            const files = await res.json();
            if (!Array.isArray(files) || files.length === 0) return;

            const forbidden = getForbiddenRect();
            let cells = shuffle(buildGrid(files.length, forbidden));
            const anims = ['float', 'spin'];
            const padIn = 6;

            files.forEach((filename, i) => {
                if (cells.length === 0) cells = shuffle(buildGrid(files.length, forbidden));
                const cell = cells.pop();

                const maxWidth = cell.w - padIn * 2;
                const maxHeight = cell.h - padIn * 2;
                const maxAllowed = Math.min(maxWidth, maxHeight);

                const smallMin = 120, smallMax = 200;
                const bigMin = 250, bigMax = 450;

                let size;
                if (Math.random() < 0.5) {
                    if (maxAllowed < smallMin) {
                        size = maxAllowed;
                    } else {
                        size = smallMin + Math.round(Math.random() * Math.min(smallMax - smallMin, maxAllowed - smallMin));
                    }
                } else {
                    if (maxAllowed < bigMin) {
                        size = maxAllowed;
                    } else {
                        size = bigMin + Math.round(Math.random() * Math.min(bigMax - bigMin, maxAllowed - bigMin));
                    }
                }

                size = Math.max(1, size);

                const x = cell.x0 + padIn + Math.random() * (cell.w - size - padIn * 2);
                const y = cell.y0 + padIn + Math.random() * (cell.h - size - padIn * 2);

                const img = document.createElement('img');
                img.src = 'img/' + filename;
                img.alt = '';
                img.className = 'deco ' + anims[i % anims.length];
                img.style.width = size + 'px';
                img.style.setProperty('--r', (Math.random() * 24 - 12) + 'deg');
                img.style.left = x + 'px';
                img.style.top = y + 'px';
                document.body.appendChild(img);
            });
        } catch (e) {}
    }
    window.addEventListener('load', loadDecorations);
    // ===== конец авто-декора =====

    const API_BASE = 'https://yt-2-mp3.relaxdev.ru';
    let currentTracks = [];

    async function process() {
        const urlInput = document.getElementById('urlInput');
        const resultDiv = document.getElementById('result');
        const trackListDiv = document.getElementById('trackList');
        const batchDiv = document.getElementById('batchButtons');
        let url = urlInput.value.trim();

        // Сброс
        trackListDiv.style.display = 'none';
        trackListDiv.innerHTML = '';
        batchDiv.style.display = 'none';
        currentTracks = [];

        if (!url) {
            resultDiv.innerHTML = '<span class="link">⚠️ вставь ссылку на YouTube</span>';
            return;
        }

        url = url.replace(/\\/g, '');

        if (!url.includes('list=')) {
            trackListDiv.style.display = 'none';
            trackListDiv.innerHTML = '';
            resultDiv.innerHTML = '<span class="link loading">⏳ секунду...</span>';
            try {
                const apiUrl = `${API_BASE}/download?url=${encodeURIComponent(url)}`;
                const response = await fetch(apiUrl);
                const data = await response.json();
                if (data.link) {
                    resultDiv.innerHTML = `
                        <span class="link">✅ <a href="${data.link}" target="_blank">${data.link}</a></span>
                        <button class="copy-btn" onclick="copyLink('${data.link}')">копировать</button>
                    `;
                } else {
                    resultDiv.innerHTML = '<span class="link">❌ ошибка: ' + (data.error || 'неизвестная проблема') + '</span>';
                }
            } catch (err) {
                resultDiv.innerHTML = '<span class="link">❌ ошибка: ' + err.message + '</span>';
            }
            return;
        }

        resultDiv.innerHTML = '<span class="link loading">⏳ скачиваем трек...</span>';
        trackListDiv.style.display = 'none';
        trackListDiv.innerHTML = '';

        try {
            const urlParams = new URLSearchParams(new URL(url).search);
            let videoId = urlParams.get('v');
            if (!videoId) {
                resultDiv.innerHTML = '<span class="link">⚠️ не удалось определить трек для скачивания</span>';
                return;
            }

            const downloadUrl = `${API_BASE}/download?url=${encodeURIComponent(`https://www.youtube.com/watch?v=${videoId}`)}`;
            const downloadResp = await fetch(downloadUrl);
            const downloadData = await downloadResp.json();

            if (downloadData.link) {
                resultDiv.innerHTML = `
                    <span class="link">✅ <a href="${downloadData.link}" target="_blank">${downloadData.link}</a></span>
                    <button class="copy-btn" onclick="copyLink('${downloadData.link}')">копировать</button>
                `;
            } else {
                resultDiv.innerHTML = '<span class="link">❌ ошибка при скачивании трека: ' + (downloadData.error || 'неизвестная проблема') + '</span>';
                return;
            }

            resultDiv.innerHTML += '<br><span class="link loading">⏳ загружаем плейлист...</span>';
            const encodedUrl = encodeURIComponent(url);
            const playlistResp = await fetch(`${API_BASE}/playlist?url=${encodedUrl}`);
            const playlistData = await playlistResp.json();

            if (playlistData.error) {
                resultDiv.innerHTML += '<br><span class="link">❌ ошибка загрузки плейлиста: ' + playlistData.error + '</span>';
                return;
            }

            if (playlistData.tracks && playlistData.tracks.length > 0) {
                currentTracks = playlistData.tracks;

                const toggleBtn = document.createElement('button');
                toggleBtn.textContent = `📋 Показать все треки из плейлиста (${playlistData.tracks.length})`;
                toggleBtn.style.marginTop = '10px';
                toggleBtn.style.padding = '4px 12px';
                toggleBtn.style.cursor = 'pointer';
                toggleBtn.onclick = () => {
                    const list = document.getElementById('trackList');
                    if (list.style.display === 'none') {
                        list.style.display = 'block';
                        toggleBtn.textContent = '🔼 Скрыть треки';
                    } else {
                        list.style.display = 'none';
                        toggleBtn.textContent = `📋 Показать все треки из плейлиста (${playlistData.tracks.length})`;
                    }
                };
                resultDiv.appendChild(toggleBtn);

                renderTrackList(playlistData.tracks);
                document.getElementById('trackList').style.display = 'none';
                batchDiv.style.display = 'flex';
            } else {
                resultDiv.innerHTML += '<br><span class="link">❌ треков не найдено</span>';
            }

        } catch (err) {
            resultDiv.innerHTML = '<span class="link">❌ ошибка: ' + err.message + '</span>';
        }
    }

    function renderTrackList(tracks) {
        const trackListDiv = document.getElementById('trackList');
        trackListDiv.innerHTML = '';
        trackListDiv.style.display = 'block';

        tracks.forEach((track, index) => {
            const item = document.createElement('div');
            item.className = 'track-item';
            item.dataset.url = track.url;  // сохраняем URL для сбора ссылок

            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.className = 'track-checkbox';
            checkbox.checked = true;
            checkbox.dataset.index = index;

            const img = document.createElement('img');
            img.className = 'track-thumb';
            img.src = track.thumbnail || '';
            img.alt = '';
            if (!track.thumbnail) img.style.display = 'none';

            const titleSpan = document.createElement('span');
            titleSpan.className = 'track-title';
            titleSpan.textContent = `${index + 1}. ${track.title}`;

            const actionCell = document.createElement('span');
            actionCell.className = 'track-action';

            const btn = document.createElement('button');
            btn.className = 'track-btn';
            btn.textContent = 'mp3';
            btn.onclick = async () => {
                btn.textContent = '⏳';
                btn.disabled = true;
                try {
                    const resp = await fetch(`${API_BASE}/download?url=${encodeURIComponent(track.url)}`);
                    const data = await resp.json();
                    if (data.link) {
                        actionCell.innerHTML = '';
                        const openLink = document.createElement('a');
                        openLink.href = data.link;
                        openLink.target = '_blank';
                        openLink.className = 'track-link-btn';
                        openLink.textContent = '▶ ссылка';
                        const copyBtn = document.createElement('button');
                        copyBtn.className = 'track-copy-btn';
                        copyBtn.textContent = '📋';
                        copyBtn.onclick = () => {
                            navigator.clipboard.writeText(data.link).then(() => {
                                copyBtn.textContent = '✅';
                                copyBtn.classList.add('copied');
                                setTimeout(() => {
                                    copyBtn.textContent = '📋';
                                    copyBtn.classList.remove('copied');
                                }, 2000);
                            }).catch(() => alert('не удалось скопировать'));
                        };
                        actionCell.appendChild(openLink);
                        actionCell.appendChild(copyBtn);
                    } else {
                        btn.textContent = '❌';
                        btn.disabled = false;
                    }
                } catch (e) {
                    btn.textContent = '❌';
                    btn.disabled = false;
                }
            };

            actionCell.appendChild(btn);

            item.appendChild(checkbox);
            item.appendChild(img);
            item.appendChild(titleSpan);
            item.appendChild(actionCell);
            trackListDiv.appendChild(item);
        });
    }

    function copyLink(link) {
        navigator.clipboard.writeText(link).then(() => {
            const btn = document.querySelector('.copy-btn');
            if (btn) {
                btn.textContent = '✅ скопировано';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = 'копировать';
                    btn.classList.remove('copied');
                }, 2500);
            }
        }).catch(() => {
            alert('не удалось скопировать, скопируйте вручную');
        });
    }

    function getDownloadedLinks() {
        const links = [];
        document.querySelectorAll('.track-item').forEach((item) => {
            const linkBtn = item.querySelector('a[href*=".mp3"]');
            if (linkBtn) {
                links.push(linkBtn.href);
            }
        });
        return links;
    }

    function getSelectedTracks() {
        const checkboxes = document.querySelectorAll('.track-checkbox');
        const selected = [];
        checkboxes.forEach((cb) => {
            if (cb.checked) {
                const index = parseInt(cb.dataset.index);
                selected.push(currentTracks[index]);
            }
        });
        return selected;
    }

    async function downloadZip() {
        const btn = document.getElementById('zipBtn');
        btn.disabled = true;
        btn.textContent = '⏳';

        try {
            // 1. Проверяем, есть ли готовые ссылки
            const links = getDownloadedLinks();
            if (links.length > 0) {
                const resp = await fetch(`${API_BASE}/zip-from-links`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ links: links })
                });
                if (!resp.ok) throw new Error('Ошибка сервера');
                const blob = await resp.blob();
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'playlist.zip';
                a.click();
                btn.disabled = false;
                btn.textContent = '📦 Скачать ZIP';
                return;
            }

            // 2. Иначе — конвертируем выбранные треки (или все, если ничего не выбрано)
            const selected = getSelectedTracks();
            if (selected.length === 0) {
                alert('Выберите хотя бы один трек');
                btn.disabled = false;
                btn.textContent = '📦 Скачать ZIP';
                return;
            }
            // Показываем предупреждение, что процесс может занять время
            alert('Начинается конвертация всех треков. Это может занять 1–3 минуты в зависимости от количества треков.');
            const resp = await fetch(`${API_BASE}/zip`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tracks: selected })
            });
            if (!resp.ok) throw new Error('Ошибка сервера');
            const blob = await resp.blob();
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'playlist.zip';
            a.click();
        } catch (e) {
            alert('Ошибка: ' + e.message);
        } finally {
            btn.disabled = false;
            btn.textContent = '📦 Скачать ZIP';
        }
    }

    async function downloadMerge() {
        const btn = document.getElementById('mergeBtn');
        btn.disabled = true;
        btn.textContent = '⏳';

        try {
            const links = getDownloadedLinks();
            if (links.length > 0) {
                const resp = await fetch(`${API_BASE}/merge-from-links`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ links: links })
                });
                if (!resp.ok) throw new Error('Ошибка сервера');
                const blob = await resp.blob();
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'merged.mp3';
                a.click();
                btn.disabled = false;
                btn.textContent = '🔗 Объединить в один MP3';
                return;
            }

            const selected = getSelectedTracks();
            if (selected.length === 0) {
                alert('Выберите хотя бы один трек');
                btn.disabled = false;
                btn.textContent = '🔗 Объединить в один MP3';
                return;
            }
            alert('Начинается конвертация всех треков. Это может занять 1–3 минуты.');
            const resp = await fetch(`${API_BASE}/merge`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tracks: selected })
            });
            if (!resp.ok) throw new Error('Ошибка сервера');
            const blob = await resp.blob();
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'merged.mp3';
            a.click();
        } catch (e) {
            alert('Ошибка: ' + e.message);
        } finally {
            btn.disabled = false;
            btn.textContent = '🔗 Объединить в один MP3';
